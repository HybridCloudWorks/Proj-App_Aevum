name: PR Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Lint, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Check formatting of changed web files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD -- "apps/web/src/**/*.js" "apps/web/src/**/*.jsx" "apps/web/src/**/*.ts" "apps/web/src/**/*.tsx" "apps/web/src/**/*.css" "apps/web/src/**/*.json")
          if (( ${#files[@]} )); then
            npx prettier --check "${files[@]}"
          fi
      - name: Test web files in isolated processes
        working-directory: apps/web
        run: |
          while IFS= read -r test_file; do
            echo "Running $test_file"
            timeout 60s npx vitest run "$test_file" --pool=forks --maxWorkers=1 --minWorkers=1
          done < <(find src -type f \( -name "*.test.js" -o -name "*.test.jsx" -o -name "*.test.ts" -o -name "*.test.tsx" \) -print | sort)
      - run: npm run build
        env:
          VITE_ENABLE_PROTOTYPE_FEATURES: "false"

  firebase-rules:
    name: Firebase Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install emulator tooling
        run: npm install --global firebase-tools@15.28.2 @firebase/rules-unit-testing@5.0.2 firebase@12.18.0
      - name: Test Firebase rules and Private Beta journey
        run: |
          export NODE_PATH="$(npm root -g)"
          timeout 300s firebase emulators:exec --only auth,firestore,storage --project demo-aevum "node tests/firebase/security-rules.cjs && node tests/firebase/index-contract.cjs && node tests/firebase/private-beta-journey.cjs"

  preservation:
    name: Preservation Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/src/functions/preservation-processor/requirements.txt
      - name: Verify Cloud Function direct dependencies are pinned
        run: |
          for requirements in infrastructure/src/functions/*/requirements.txt; do
            if grep -Ev '^[A-Za-z0-9_.-]+==[^[:space:]]+$' "$requirements"; then
              echo "::error file=$requirements::Every direct dependency must use an exact == pin."
              exit 1
            fi
          done
      - name: Install preservation dependencies
        run: pip install --requirement infrastructure/src/functions/preservation-processor/requirements.txt
      - name: Test preservation processor
        working-directory: infrastructure/src/functions/preservation-processor
        run: python -m unittest discover -s tests -v

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"
      - run: terraform fmt -check -recursive infrastructure
      - name: Validate data module
        working-directory: infrastructure/data/terraform
        run: terraform init -backend=false -input=false -lockfile=readonly && terraform validate
      - name: Validate computeless module
        working-directory: infrastructure/computeless/terraform
        run: terraform init -backend=false -input=false -lockfile=readonly && terraform validate

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Verify committed lockfile
        run: git diff --exit-code -- apps/mobile/pubspec.lock
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: apps/mobile
        run: flutter test
      - name: Build Android debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub
 "$requirements"; then
              echo "::error file=$requirements::Every direct dependency must use an exact == pin."
              exit 1
            fi
          done
      - name: Install preservation dependencies
        run: pip install --requirement infrastructure/src/functions/preservation-processor/requirements.txt
      - name: Test preservation processor
        working-directory: infrastructure/src/functions/preservation-processor
        run: python -m unittest discover -s tests -v

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"
      - run: terraform fmt -check -recursive infrastructure
      - name: Validate data module
        working-directory: infrastructure/data/terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate computeless module
        working-directory: infrastructure/computeless/terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: Capture Terraform provider locks
        uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-locks
          include-hidden-files: true
          path: |
            infrastructure/data/terraform/.terraform.lock.hcl
            infrastructure/computeless/terraform/.terraform.lock.hcl
          retention-days: 1

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Verify committed lockfile
        run: git diff --exit-code -- apps/mobile/pubspec.lock
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: apps/mobile
        run: flutter test
      - name: Build Android debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub
