<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary Meta Tags -->
    <title>Aevum - Connect with Your Heritage</title>
    <meta name="title" content="Aevum - Connect with Your Heritage" />
    <meta
      name="description"
      content="Discover your family roots, preserve memories, and explore your heritage with AI-powered genealogy tools."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aevum.web.app/" />
    <meta property="og:title" content="Aevum - Connect with Your Heritage" />
    <meta
      property="og:description"
      content="Discover your family roots, preserve memories, and explore your heritage with AI-powered genealogy tools."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://aevum.web.app/" />
    <meta
      property="twitter:title"
      content="Aevum - Connect with Your Heritage"
    />
    <meta
      property="twitter:description"
      content="Discover your family roots, preserve memories, and explore your heritage with AI-powered genealogy tools."
    />

    <!-- Mobile Status Bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    />
    <!-- Material Symbols Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
