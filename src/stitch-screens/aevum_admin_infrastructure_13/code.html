<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aevum Conflict Resolver</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1173d4",
                        "accent": "#8b5cf6",
                        "danger": "#ef4444",
                        "success": "#10b981",
                        "background-light": "#f6f7f8",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                    backdropBlur: {
                        xs: '2px',
                    }
                },
            },
        }
    </script>
<style>.glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .glass-card-selected {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }
        .glass-badge {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .diff-highlight-old {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            text-decoration: line-through;
            padding: 0 4px;
            border-radius: 4px;
        }
        .diff-highlight-new {
            background-color: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            padding: 0 4px;
            border-radius: 4px;
        }
        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.1) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 70%);
            filter: blur(60px);
            z-index: -1;
            pointer-events: none;
        }
        input[type="radio"]:checked + div {}
        .radio-indicator::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.2s ease;
        }
        input[type="radio"]:checked + div .radio-indicator {
            background-color: #10b981;
            border-color: #10b981;
        }
        input[type="radio"]:checked + div .radio-indicator::after {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-white min-h-screen flex flex-col">
<div class="ambient-glow"></div>
<header class="sticky top-0 z-50 flex items-center justify-between p-5 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-xl border-b border-white/5">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-10 rounded-xl bg-gradient-to-br from-danger/20 to-accent/20 text-danger border border-white/5">
<span class="material-symbols-outlined text-[24px]">sync_problem</span>
</div>
<div>
<h1 class="text-lg font-bold leading-tight tracking-tight">Sync Conflict</h1>
<div class="flex items-center gap-1.5">
<span class="text-xs font-medium text-slate-500 dark:text-slate-400">Eleanor Rigby</span>
<span class="size-1 rounded-full bg-slate-600"></span>
<span class="text-xs font-medium text-danger">2 versions found</span>
</div>
</div>
</div>
<button class="flex items-center justify-center size-8 rounded-full bg-white/5 hover:bg-white/10 text-slate-400 transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</header>
<main class="flex-1 p-5 flex flex-col gap-6 w-full max-w-md mx-auto relative z-10 pb-32">
<section class="text-center mb-2">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full glass-badge text-xs font-medium text-slate-300 mb-3">
<span class="material-symbols-outlined text-[16px] text-accent">history</span>
            Conflict detected 12m ago
        </div>
<h2 class="text-2xl font-bold mb-2 bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Resolve Data Mismatch</h2>
<p class="text-sm text-slate-400 leading-relaxed">Two admins edited this profile simultaneously. Please select the correct version to keep.</p>
</section>
<form class="flex flex-col gap-4">
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="conflict_resolution" type="radio" value="version_a"/>
<div class="glass-card p-5 rounded-2xl border border-white/10 transition-all duration-300 hover:bg-white/5 peer-checked:glass-card-selected relative overflow-hidden">
<div class="absolute top-0 right-0 p-3 opacity-0 peer-checked:opacity-100 transition-opacity">
<div class="bg-success text-white rounded-full p-1 shadow-lg shadow-success/20">
<span class="material-symbols-outlined text-[20px]">check</span>
</div>
</div>
<div class="flex flex-col gap-4">
<div class="flex items-center justify-between border-b border-white/5 pb-3">
<div class="flex items-center gap-3">
<div class="size-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-xs font-bold text-white shadow-lg">JD</div>
<div>
<div class="text-xs text-slate-400 font-medium">Updated by</div>
<div class="text-sm font-bold text-white">John Doe</div>
</div>
</div>
<div class="text-right">
<div class="text-xs text-slate-400 font-medium">Timestamp</div>
<div class="text-sm font-bold text-white">10:42 AM</div>
</div>
</div>
<div class="space-y-3">
<div class="flex justify-between items-center group/field">
<span class="text-xs uppercase tracking-wider text-slate-500 font-bold">Birth Date</span>
<span class="text-sm font-mono bg-white/5 px-2 py-1 rounded text-slate-300 group-hover/field:bg-white/10 transition-colors">1924-04-12</span>
</div>
<div class="flex justify-between items-center group/field">
<span class="text-xs uppercase tracking-wider text-slate-500 font-bold">Birth Place</span>
<span class="text-sm font-mono bg-white/5 px-2 py-1 rounded text-slate-300 group-hover/field:bg-white/10 transition-colors">Liverpool, UK</span>
</div>
<div class="mt-2 bg-white/5 rounded-lg p-3 border border-white/5">
<div class="text-xs text-slate-500 mb-1 font-medium">Notes Added</div>
<p class="text-sm text-slate-300 italic">"Updated birth records from parish register found in attic."</p>
</div>
</div>
</div>
</div>
</label>
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="conflict_resolution" type="radio" value="version_b"/>
<div class="glass-card p-5 rounded-2xl border border-white/10 transition-all duration-300 hover:bg-white/5 peer-checked:glass-card-selected relative overflow-hidden">
<div class="absolute top-0 right-0 p-3 opacity-0 peer-checked:opacity-100 transition-opacity">
<div class="bg-success text-white rounded-full p-1 shadow-lg shadow-success/20">
<span class="material-symbols-outlined text-[20px]">check</span>
</div>
</div>
<div class="flex flex-col gap-4">
<div class="flex items-center justify-between border-b border-white/5 pb-3">
<div class="flex items-center gap-3">
<div class="size-8 rounded-full bg-gradient-to-br from-purple-500 to-pink-600 flex items-center justify-center text-xs font-bold text-white shadow-lg">SM</div>
<div>
<div class="text-xs text-slate-400 font-medium">Updated by</div>
<div class="text-sm font-bold text-white">Sarah Miller</div>
</div>
</div>
<div class="text-right">
<div class="text-xs text-slate-400 font-medium">Timestamp</div>
<div class="text-sm font-bold text-white">10:45 AM</div>
</div>
</div>
<div class="space-y-3">
<div class="flex justify-between items-center group/field">
<span class="text-xs uppercase tracking-wider text-slate-500 font-bold">Birth Date</span>
<span class="text-sm font-mono diff-highlight-new border border-emerald-500/30">1924-04-14</span>
</div>
<div class="flex justify-between items-center group/field">
<span class="text-xs uppercase tracking-wider text-slate-500 font-bold">Birth Place</span>
<span class="text-sm font-mono bg-white/5 px-2 py-1 rounded text-slate-300 group-hover/field:bg-white/10 transition-colors">Liverpool, UK</span>
</div>
<div class="mt-2 bg-white/5 rounded-lg p-3 border border-white/5">
<div class="text-xs text-slate-500 mb-1 font-medium">Notes Added</div>
<p class="text-sm text-slate-300 italic">"Corrected date based on birth certificate scan."</p>
</div>
</div>
</div>
</div>
</label>
</form>
</main>
<div class="fixed bottom-0 left-0 w-full p-5 bg-gradient-to-t from-background-dark via-background-dark/95 to-transparent z-20">
<div class="max-w-md mx-auto flex flex-col gap-3">
<button class="w-full bg-white/5 hover:bg-white/10 text-slate-300 font-medium py-3.5 rounded-xl transition-all border border-white/10 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">edit</span>
<span>Manually Edit</span>
</button>
<button class="w-full bg-success hover:bg-success/90 text-white font-bold py-3.5 rounded-xl transition-all shadow-[0_0_20px_rgba(16,185,129,0.3)] flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined">call_merge</span>
<span>Merge Selected Version</span>
</button>
</div>
</div>
</body></html>
