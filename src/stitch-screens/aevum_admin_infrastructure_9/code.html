<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aevum Storage Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1173d4",
                        "accent": "#8b5cf6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                    backdropBlur: {
                        xs: '2px',
                    }
                },
            },
        }
    </script>
<style>.glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .glass-card-selected {
            background: linear-gradient(135deg, rgba(17, 115, 212, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(17, 115, 212, 0.5);
            box-shadow: 0 0 20px rgba(17, 115, 212, 0.15);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.2s;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(17, 115, 212, 0.5);
            outline: none;
            box-shadow: 0 0 0 2px rgba(17, 115, 212, 0.2);
        }.ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(17, 115, 212, 0.15) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 70%);
            filter: blur(60px);
            z-index: -1;
            pointer-events: none;
        }input[type="radio"]:checked + div {
            border-color: #1173d4;
            background-color: rgba(17, 115, 212, 0.1);
        }
        input[type="radio"]:checked + div .radio-indicator {
            background-color: #1173d4;
            border-color: #1173d4;
        }
        input[type="radio"]:checked + div .radio-indicator::after {
            transform: scale(1);
        }
        .radio-indicator::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.2s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-white min-h-screen flex flex-col">
<div class="ambient-glow"></div>
<header class="sticky top-0 z-50 flex items-center justify-between p-5 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-xl border-b border-white/5">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-10 rounded-xl bg-gradient-to-br from-primary/20 to-accent/20 text-primary border border-white/5">
<span class="material-symbols-outlined text-[24px]">folder_managed</span>
</div>
<div>
<h1 class="text-lg font-bold leading-tight tracking-tight">Storage Setup</h1>
<div class="flex items-center gap-1.5">
<span class="text-xs font-medium text-slate-500 dark:text-slate-400">Step 2 of 3</span>
<span class="size-1 rounded-full bg-slate-600"></span>
<span class="text-xs font-medium text-primary">Configuration</span>
</div>
</div>
</div>
<button class="text-sm font-medium text-slate-400 hover:text-white transition-colors">Help</button>
</header>
<main class="flex-1 p-5 flex flex-col gap-6 w-full max-w-md mx-auto relative z-10">
<section class="text-center mb-2">
<h2 class="text-2xl font-bold mb-2 bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Your Data, Your Control</h2>
<p class="text-sm text-slate-400 leading-relaxed">Choose how you want to store your family's heritage. Aevum is built on a "Zero-Lock-In" philosophy.</p>
</section>
<form class="flex flex-col gap-4">
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="storage_plan" type="radio" value="managed"/>
<div class="glass-card p-5 rounded-2xl border border-white/10 transition-all duration-300 hover:bg-white/5 peer-checked:border-primary peer-checked:bg-primary/5">
<div class="flex justify-between items-start mb-3">
<div class="flex items-center gap-3">
<div class="radio-indicator w-5 h-5 rounded-full border-2 border-slate-500 relative transition-colors"></div>
<div>
<div class="font-bold text-lg">Aevum Managed</div>
<div class="text-xs text-emerald-400 font-medium flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">verified</span>
                                    Recommended
                                </div>
</div>
</div>
<div class="text-right">
<span class="text-xl font-bold">$12</span><span class="text-xs text-slate-400">/mo</span>
</div>
</div>
<ul class="space-y-2 mb-4">
<li class="flex items-center gap-2 text-sm text-slate-300">
<span class="material-symbols-outlined text-primary text-[16px]">cloud_done</span>
<span>Unlimited secure photo storage</span>
</li>
<li class="flex items-center gap-2 text-sm text-slate-300">
<span class="material-symbols-outlined text-primary text-[16px]">security</span>
<span>Automated geo-redundancy</span>
</li>
</ul>
<div class="w-full h-1 bg-white/5 rounded-full overflow-hidden">
<div class="w-full h-full bg-primary/40"></div>
</div>
<p class="mt-2 text-xs text-slate-500">Hassle-free. We manage the infrastructure.</p>
</div>
</label>
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="storage_plan" type="radio" value="basic"/>
<div class="glass-card p-5 rounded-2xl border border-white/10 transition-all duration-300 hover:bg-white/5 peer-checked:border-primary peer-checked:bg-primary/5">
<div class="flex justify-between items-start mb-3">
<div class="flex items-center gap-3">
<div class="radio-indicator w-5 h-5 rounded-full border-2 border-slate-500 relative transition-colors"></div>
<div>
<div class="font-bold text-lg">Aevum Basic</div>
<div class="text-xs text-slate-400 font-medium">BYOB Storage</div>
</div>
</div>
<div class="text-right">
<span class="text-xl font-bold">$4</span><span class="text-xs text-slate-400">/mo</span>
</div>
</div>
<p class="text-sm text-slate-300 mb-4">Connect your own cloud bucket. You pay only for the app interface, you own the data storage directly.</p>
<div class="mt-4 pt-4 border-t border-white/10 space-y-4">
<div class="flex items-center justify-between text-xs uppercase tracking-wider font-bold text-slate-500 mb-2">
<span>Provider Credentials</span>
<span class="material-symbols-outlined text-[16px]">terminal</span>
</div>
<div class="grid grid-cols-3 gap-2 mb-4">
<button class="bg-primary/20 border border-primary/50 text-white rounded-lg py-2 text-xs font-bold hover:bg-primary/30 transition" type="button">AWS S3</button>
<button class="bg-white/5 border border-white/10 text-slate-400 rounded-lg py-2 text-xs font-medium hover:bg-white/10 transition" type="button">Azure</button>
<button class="bg-white/5 border border-white/10 text-slate-400 rounded-lg py-2 text-xs font-medium hover:bg-white/10 transition" type="button">GCP</button>
</div>
<div class="space-y-3">
<div class="space-y-1">
<label class="text-xs text-slate-400 ml-1">Bucket Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-500 text-[18px]">folder_open</span>
<input class="glass-input w-full rounded-lg py-2 pl-9 pr-3 text-sm placeholder:text-slate-600" placeholder="my-family-archive" type="text"/>
</div>
</div>
<div class="space-y-1">
<label class="text-xs text-slate-400 ml-1">Access Key ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-500 text-[18px]">key</span>
<input class="glass-input w-full rounded-lg py-2 pl-9 pr-3 text-sm placeholder:text-slate-600 font-mono" placeholder="AKIA..." type="text"/>
</div>
</div>
<div class="space-y-1">
<label class="text-xs text-slate-400 ml-1">Secret Access Key</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-500 text-[18px]">lock</span>
<input class="glass-input w-full rounded-lg py-2 pl-9 pr-3 text-sm placeholder:text-slate-600 font-mono" placeholder="••••••••••••••••" type="password"/>
</div>
</div>
<div class="space-y-1">
<label class="text-xs text-slate-400 ml-1">Region</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-500 text-[18px]">public</span>
<select class="glass-input w-full rounded-lg py-2 pl-9 pr-8 text-sm appearance-none cursor-pointer">
<option>us-east-1 (N. Virginia)</option>
<option>us-west-2 (Oregon)</option>
<option>eu-central-1 (Frankfurt)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-slate-500 text-[18px] pointer-events-none">expand_more</span>
</div>
</div>
</div>
<div class="flex items-center gap-2 mt-2">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
</span>
<span class="text-xs text-amber-500 font-mono">Waiting for credentials...</span>
</div>
</div>
</div>
</label>
</form>
</main>
<div class="sticky bottom-0 p-5 bg-gradient-to-t from-background-dark via-background-dark/95 to-transparent z-20">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 rounded-xl transition-all shadow-[0_0_20px_rgba(17,115,212,0.4)] flex items-center justify-center gap-2 group">
<span>Confirm Configuration</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<p class="text-center mt-3 text-xs text-slate-500">
            Secure 256-bit encrypted connection
        </p>
</div>

</body></html>
